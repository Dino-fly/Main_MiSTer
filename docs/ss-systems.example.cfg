# Classic Home ScreenScraper system-id overrides.
#
# Copy to classicui/ss-systems.cfg on the SD card (next to disctitles.txt and the
# ScreenScraper miss store, not at the card's root) to correct or extend
# ss_system_id()'s built-in table without a rebuild. Loaded once at start-up; a
# missing file is simply no overrides, not an error. One mapping per line:
#
#   <sysid>=<screenscraper systemeid>
#
# sysid is chome_lib.cpp's library id - nes, psx, saturn, and so on, the same one
# in a "ClassicUI: <sysid> core is ..." log line. The number is ScreenScraper's
# systemeid, from https://www.screenscraper.fr/api2/systemesListe.php - not a
# guess: a wrong number does not fail, it silently matches a different platform
# and puts that platform's box art on the shelf.
#
# This replaces the built-in entry for that sysid entirely, including its
# extension-specific cases: an override for "ngp" also takes over what a .ngc
# file in that shelf resolves to, because ss_system_id() checks the override
# before it ever looks at the file's extension. It cannot correct just one
# extension and leave the others built in - override the whole shelf or none
# of it.
#
# # or ; starts a comment; blank lines are ignored; anything after the "=" that
# is not a plain positive number is dropped rather than sent to a URL.

# Worked example, not a live override: PSX is already built in at 57. Copy this
# line and change the number the day ScreenScraper renumbers a platform under
# you and a rebuild is not close enough.
#psx=57

# The built-in table leaves one shelf's third extension unresolved on purpose:
# chome_lib.cpp's Neo Geo Pocket row accepts .ngp, .ngc and .npc, and only .ngp
# (plain, monochrome) and .ngc (Color) are systemeids either reference client
# this was checked against will name with confidence. If every .npc file on this
# card is actually one platform or the other, an override for "ngp" here will
# send *all three* extensions to the same systemeid - which is only right if
# none of your .ngp/.ngc files need the built-in split. Renaming the .npc files
# to whichever extension they really are is usually the better fix.
#ngp=25
